name: Financial backup (schema + scoped data)

# Manual trigger (workflow_dispatch) plus a `schedule:` trigger for an automated daily backup and
# weekly restore-test. The schedule entries fire unconditionally (both jobs start on every
# matching cron tick) -- but every scheduled firing is a no-op unless a manager has explicitly
# turned automation on from the app (Setup -> Backups / הגדרות -> גיבויים). That on/off state is
# NOT a GitHub repo variable (the app has no GitHub credential to set one) -- it's a small,
# auditable, append-only config object in the same R2 bucket this workflow already reads/writes,
# set by the manage-backup-automation Edge Function and read here by the "Scheduled-run guard"
# step (src/scheduled-run-guard.js) using the SAME R2 reader credential already in this job. No
# config object ever having been written means disabled -- the safe default -- so merging this
# file, or this file's schedule simply existing, never starts a real backup on its own. See also
# scripts/financial-backup/src/scheduled-run-guard.js for why there are four cron entries, not two
# or one.
#
# Israel has no single fixed UTC offset (IDT in summer / IST in winter), and a GitHub Actions cron
# is UTC-only and can't express "the DST-adjusted local time." Two cron entries per schedule (one
# written for each season) plus a guard step that checks Israel's ACTUAL current UTC offset is
# what lands this at ~03:00 Israel time year-round without any external scheduling service.
# Deliberately NOT a strict wall-clock-hour check: GitHub's own documented behavior is that
# scheduled runs "may be delayed during periods of high load" or occasionally skipped outright --
# an hour-equality guard would incorrectly skip exactly the delayed run it should still perform.
# The guard instead asks two calendar-grain questions ("is this cron entry for the DST season
# Israel is CURRENTLY in" and "has today's/this week's work already happened"), both robust to a
# run being minutes or hours late.
on:
  schedule:
    - cron: "0 0 * * *"   # daily backup -- Israel IDT season (00:00 UTC = 03:00 IDT)
    - cron: "0 1 * * *"   # daily backup -- Israel IST season (01:00 UTC = 03:00 IST)
    - cron: "0 2 * * 0"   # weekly restore-test, Sundays -- Israel IDT season
    - cron: "0 3 * * 0"   # weekly restore-test, Sundays -- Israel IST season
  workflow_dispatch:
    inputs:
      mode:
        description: "'connection-check' runs ONLY `SELECT 1` against FINANCIAL_BACKUP_SOURCE_URL (no dump, no R2) -- use this to prove a new/rotated connection string works before ever running a real backup against it. 'restore-test' proves a named backup (backup_id, below) is genuinely restorable -- into a throwaway container, never production. 'health' is read-only (reader R2 credential only, no writes) -- lists existing manifests/verifications/restore-test results and reports health.js's computed status, for independently checking state without running a backup or restore-test."
        type: choice
        options: [backup, connection-check, restore-test, health]
        default: backup
      upload_to_r2:
        description: "backup mode only: upload the resulting backup to R2 under db-backups/ (leave false for a dry run)"
        type: boolean
        default: false
      environment:
        description: "backup mode only: backup label -- every value other than 'production' is always treated as a test run"
        type: choice
        options: [test, production]
        default: test
      backup_id:
        description: "restore-test mode only: the backup_id (from db-backups/manifests/<id>.json) to restore and verify. Leave blank to auto-select the latest remotely-verified production backup (same selection a scheduled weekly run uses)."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    # Guards against a manual dispatch accidentally being run against a feature branch's copy of
    # this workflow -- a financial backup should only ever run from the reviewed, merged version.
    # For a `schedule` event: only the two daily-backup cron entries reach this job at all (the
    # weekly-restore-test entries are filtered out here so they never start this job uselessly).
    # Deliberately NOT gated here on a static GitHub repo variable -- the real on/off decision is
    # the manager-controlled, R2-resident automation config the "Scheduled-run guard" step below
    # reads (see src/scheduled-run-guard.js and supabase/functions/manage-backup-automation). This
    # job-level `if:` only decides whether the lightweight guard check runs at all on a schedule
    # firing; it always does, so a disabled-but-registered schedule is visibly a fast no-op in the
    # Actions log rather than the run never appearing.
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'schedule' &&
          contains(fromJSON('["0 0 * * *","0 1 * * *"]'), github.event.schedule)
        )
      )
    env:
      # Unifies workflow_dispatch inputs and the (input-less) schedule event into one set of
      # names every later step/condition reads -- a `schedule` event always means a real
      # production backup upload, never a dry run or a test label, by design.
      RUN_MODE: ${{ github.event_name == 'schedule' && 'backup' || inputs.mode }}
      RUN_ENVIRONMENT: ${{ github.event_name == 'schedule' && 'production' || inputs.environment }}
      RUN_UPLOAD_TO_R2: ${{ github.event_name == 'schedule' && 'true' || (inputs.upload_to_r2 && 'true' || 'false') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client-17
        # The generic `postgresql-client` apt package on ubuntu-latest can lag behind Supabase's
        # Postgres 17 server -- pg_dump's client must be >= the server's major version. Add the
        # PGDG apt repo explicitly rather than assume the default package is new enough.
        #
        # ubuntu-latest's toolcache already has an OLDER postgresql-client earlier on PATH --
        # confirmed by a real run: this step installed 17.11 here, but bare `pg_dump`/`psql` in
        # LATER steps still resolved to 16.15 regardless. Installing the package is not enough;
        # PATH must be fixed explicitly, and verified, not assumed.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

          # Prepend the version-17 bin dir so it wins over whatever came before it on PATH, for
          # every later step in this job -- including the npm scripts that spawn `pg_dump`/`psql`
          # by bare name. ($GITHUB_PATH changes apply to subsequent steps, not the rest of this one.)
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

          # Fail HERE, loudly, if that didn't produce a real v17 binary -- check the exact path
          # directly rather than bare `pg_dump` (which still resolves via the OLD PATH within this
          # same step) or just printing the version for someone to notice later.
          pg_dump_version=$(/usr/lib/postgresql/17/bin/pg_dump --version)
          psql_version=$(/usr/lib/postgresql/17/bin/psql --version)
          echo "pg_dump: $pg_dump_version"
          echo "psql:    $psql_version"
          for v in "$pg_dump_version" "$psql_version"; do
            case "$v" in
              *"(PostgreSQL) 17."*) ;;
              *) echo "::error::Expected PostgreSQL client major version 17 (matching the production server), got: $v"; exit 1 ;;
            esac
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backup tool dependencies
        working-directory: scripts/financial-backup
        run: npm install

      - name: Scheduled-run guard (DST season + already-done-today check)
        # Only meaningful for a `schedule` event -- a manual dispatch always proceeds (this step
        # no-ops otherwise). See src/scheduled-run-guard.js for exactly what this checks and why
        # it's calendar-grain, not a wall-clock-hour check.
        id: guard
        if: ${{ github.event_name == 'schedule' }}
        working-directory: scripts/financial-backup
        env:
          GUARD_KIND: daily-backup
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
          R2_ARCHIVE_READER_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_READER_ACCESS_KEY_ID }}
          R2_ARCHIVE_READER_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_READER_SECRET_ACCESS_KEY }}
        run: npm run scheduled-run-guard

      - name: Connection check only (SELECT 1, no dump, no R2)
        if: ${{ env.RUN_MODE == 'connection-check' }}
        working-directory: scripts/financial-backup
        env:
          FINANCIAL_BACKUP_SOURCE_URL: ${{ secrets.FINANCIAL_BACKUP_SOURCE_URL }}
        run: npm run check-connection

      - name: Run schema + data dump (consistent snapshot, unencrypted -- see README "Encryption")
        if: ${{ env.RUN_MODE == 'backup' && (github.event_name != 'schedule' || steps.guard.outputs.should_run == 'true') }}
        working-directory: scripts/financial-backup
        env:
          # Supavisor SESSION pooler (port 5432) -- confirmed, not the direct connection (IPv6-only
          # without the paid IPv4 add-on; this runner has no outbound IPv6) and not the transaction
          # pooler (port 6543; lacks the session-level features pg_dump/pg_restore need, including
          # the exported-snapshot mechanism this tool relies on for schema/data consistency).
          # Host/user format: aws-<region>.pooler.supabase.com, postgres.<project-ref>.
          FINANCIAL_BACKUP_SOURCE_URL: ${{ secrets.FINANCIAL_BACKUP_SOURCE_URL }}
          FINANCIAL_BACKUP_ENV: ${{ env.RUN_ENVIRONMENT }}
          UPLOAD_TO_R2: ${{ env.RUN_UPLOAD_TO_R2 == 'true' && '1' || '0' }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
          R2_ARCHIVE_WRITER_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_WRITER_ACCESS_KEY_ID }}
          R2_ARCHIVE_WRITER_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_WRITER_SECRET_ACCESS_KEY }}
          R2_ARCHIVE_READER_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_READER_ACCESS_KEY_ID }}
          R2_ARCHIVE_READER_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_READER_SECRET_ACCESS_KEY }}
        run: |
          set -eo pipefail
          attempts=0
          until npm run dump; do
            attempts=$((attempts+1))
            if [ "$attempts" -ge 3 ]; then
              echo "::error::Backup failed after 3 attempts -- see job log above (connection strings are redacted on failure, never printed in full)."
              exit 1
            fi
            echo "Attempt $attempts failed, retrying in $((attempts * 10))s..."
            sleep $((attempts * 10))
          done

      - name: Upload backup manifest (dry-run debugging only -- metadata only, never the SQL itself)
        # Backups are stored UNENCRYPTED now (see README "Encryption") -- schema.sql/data.sql under
        # out/ are real plaintext financial data (or synthetic test data) and must never be written
        # to a GitHub Actions artifact, which is a different trust/retention boundary than the
        # private R2 bucket. Only manifest.json (metadata + non-sensitive hashes, no row data) is
        # uploaded here, and only for a dry run (upload_to_r2=false) where R2 has no copy at all.
        if: ${{ always() && env.RUN_MODE == 'backup' && env.RUN_UPLOAD_TO_R2 != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: financial-backup-manifest-${{ github.run_id }}
          path: scripts/financial-backup/out/*/manifest.json
          retention-days: 3

      - name: Independent remote verification (re-downloads + re-checks the just-uploaded artifacts)
        # Runs BEFORE the health check, deliberately -- health.js's "verification_is_stale" signal
        # is only meaningful once this has had a chance to run. Running health immediately after
        # the dump (the previous ordering) meant every single successful backup was reported as
        # "critical" purely because no verification record existed YET, not because anything was
        # actually wrong -- confirmed by the project's own first production backup.
        if: ${{ env.RUN_MODE == 'backup' && env.RUN_UPLOAD_TO_R2 == 'true' && (github.event_name != 'schedule' || steps.guard.outputs.should_run == 'true') }}
        working-directory: scripts/financial-backup
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
          R2_ARCHIVE_WRITER_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_WRITER_ACCESS_KEY_ID }}
          R2_ARCHIVE_WRITER_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_WRITER_SECRET_ACCESS_KEY }}
          R2_ARCHIVE_READER_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_READER_ACCESS_KEY_ID }}
          R2_ARCHIVE_READER_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_READER_SECRET_ACCESS_KEY }}
        run: npm run verify-remote

      - name: Health check (only meaningful once uploads to R2 are enabled)
        if: ${{ env.RUN_MODE == 'backup' && env.RUN_UPLOAD_TO_R2 == 'true' && (github.event_name != 'schedule' || steps.guard.outputs.should_run == 'true') }}
        working-directory: scripts/financial-backup
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
          R2_ARCHIVE_READER_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_READER_ACCESS_KEY_ID }}
          R2_ARCHIVE_READER_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_READER_SECRET_ACCESS_KEY }}
        run: npm run health

  # Proves a named backup is genuinely restorable -- not just that its files exist and match their
  # checksums (that's already covered by verify-remote above). Restores into an ephemeral
  # postgres:17 *service container*: created fresh for this job, reachable only from this job's own
  # steps (GitHub Actions never exposes service container ports outside the runner), and destroyed
  # automatically when the job ends -- no new persistent infrastructure, no ongoing cost. It never
  # receives production credentials (only R2 READER creds, to fetch the already-made backup's
  # files) and never connects outbound to the production database at all.
  #
  # Runs on an explicit `mode: restore-test` dispatch (backup_id optional -- auto-selects the
  # latest remotely-verified backup if blank), OR on the weekly `schedule` entries (never as part
  # of an ordinary backup run). Same as the `backup` job above: not gated on a static repo
  # variable -- the "Scheduled-run guard" step inside reads the manager-controlled, R2-resident
  # automation config and no-ops if it's disabled (the default).
  restore-test:
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'restore-test') ||
        (
          github.event_name == 'schedule' &&
          contains(fromJSON('["0 2 * * 0","0 3 * * 0"]'), github.event.schedule)
        )
      )
    permissions:
      contents: read
    outputs:
      backup_id: ${{ steps.select.outputs.backup_id }}
    services:
      target:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client-17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          pg_dump_version=$(/usr/lib/postgresql/17/bin/pg_dump --version)
          psql_version=$(/usr/lib/postgresql/17/bin/psql --version)
          echo "pg_dump: $pg_dump_version"
          echo "psql:    $psql_version"
          for v in "$pg_dump_version" "$psql_version"; do
            case "$v" in
              *"(PostgreSQL) 17."*) ;;
              *) echo "::error::Expected PostgreSQL client major version 17, got: $v"; exit 1 ;;
            esac
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backup tool dependencies
        working-directory: scripts/financial-backup
        run: npm install

      - name: Scheduled-run guard (weekly cadence check)
        # Only meaningful for a `schedule` event -- a manual dispatch always proceeds.
        id: guard
        if: ${{ github.event_name == 'schedule' }}
        working-directory: scripts/financial-backup
        env:
          GUARD_KIND: weekly-restore-test
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
          R2_ARCHIVE_READER_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_READER_ACCESS_KEY_ID }}
          R2_ARCHIVE_READER_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_READER_SECRET_ACCESS_KEY }}
        run: npm run scheduled-run-guard

      - name: Select backup to test
        # A manual dispatch may name an explicit backup_id, or leave it blank to use the SAME
        # auto-selection a scheduled run uses ("the latest backup with a successful remote
        # verification" -- see select-latest-verified-backup.js). Never required to proceed.
        id: select
        if: ${{ github.event_name != 'schedule' || steps.guard.outputs.should_run == 'true' }}
        working-directory: scripts/financial-backup
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
          R2_ARCHIVE_READER_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_READER_ACCESS_KEY_ID }}
          R2_ARCHIVE_READER_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_READER_SECRET_ACCESS_KEY }}
          DISPATCH_BACKUP_ID: ${{ inputs.backup_id }}
        run: |
          set -eo pipefail
          if [ -n "$DISPATCH_BACKUP_ID" ]; then
            # Fail fast and clearly on a malformed manual input, rather than letting it propagate
            # into a confusing R2 404 three steps later, or (worse) into the result-recording
            # job's object key -- every real backup_id is a crypto.randomUUID() output.
            case "$DISPATCH_BACKUP_ID" in
              [0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]-[0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]-[0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]-[0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]-[0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F])
                echo "backup_id=$DISPATCH_BACKUP_ID" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "::error::backup_id must be a well-formed UUID (every real backup_id is one), got: \"$DISPATCH_BACKUP_ID\""
                exit 1
                ;;
            esac
          else
            npm run --silent select-latest-verified-backup
          fi

      - name: Wait for the ephemeral target to accept connections
        if: ${{ steps.select.outputs.backup_id != '' }}
        run: |
          for i in $(seq 1 30); do
            PGPASSWORD=postgres pg_isready -h localhost -U postgres && break
            sleep 1
          done

      - name: Prepare the ephemeral target (drop+recreate public, compat stub -- never touches production)
        # Exact sequence from scripts/financial-backup/README.md's own proven "Restore test (clean
        # target)" recipe:
        #   1. drop public (and leave it dropped) -- a stock postgres:17 image already has a
        #      `public` schema, and the schema dump's own `CREATE SCHEMA public` statement is not
        #      IF NOT EXISTS, so it has to be the one to (re)create it: recreating it here first
        #      just reproduces the identical "already exists" conflict one statement later.
        #   2. apply the compat stub, which creates auth/cron/extensions schemas, the btree_gist
        #      extension (into its own `extensions` schema, matching Supabase's own convention, so
        #      it survives the DROP SCHEMA public CASCADE above), and the auth.users/auth.uid()
        #      stub -- see README "Real dependencies found" for the reviewed reasoning behind each.
        #   3. point search_path at both -- the dump's own unqualified references to btree_gist
        #      need `extensions` on the path, per the stub's own documented instruction.
        if: ${{ steps.select.outputs.backup_id != '' }}
        run: |
          set -eo pipefail
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "drop schema public cascade;"
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/financial-backup/test/supabase-compat-stub.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "alter database postgres set search_path to public, extensions;"

      - name: Restore the named backup from R2 into the ephemeral target
        if: ${{ steps.select.outputs.backup_id != '' }}
        working-directory: scripts/financial-backup
        env:
          # PG_TOOLS_VIA_DOCKER=1: pg-exec.js unconditionally forces sslmode=verify-full (with
          # Supabase's own private CA) onto any "real" connection, as a deliberate control against
          # production -- correctly so, and not something to weaken here. This flag is its documented
          # escape hatch, built specifically for "a disposable local postgres:17 Docker container
          # with no TLS at all" (see pg-exec.js's own comment), which is exactly what the ephemeral
          # `target` service container is. It also runs pg_dump/pg_restore/psql from inside a throwaway
          # postgres:17 container rather than the natively-installed client, and rewrites
          # localhost -> host.docker.internal so that container can reach the service container's
          # published port on the runner.
          PG_TOOLS_VIA_DOCKER: "1"
          # Only R2 READER credentials -- this step never receives FINANCIAL_BACKUP_SOURCE_URL
          # (production) or the R2 WRITER keys. The target is the local service container, not
          # production, and it is never reachable from outside this job.
          FINANCIAL_BACKUP_TARGET_URL: postgresql://postgres:postgres@localhost:5432/postgres
          FINANCIAL_BACKUP_BACKUP_ID: ${{ steps.select.outputs.backup_id }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
          R2_ARCHIVE_READER_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_READER_ACCESS_KEY_ID }}
          R2_ARCHIVE_READER_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_READER_SECRET_ACCESS_KEY }}
        run: npm run restore

      - name: Structural, referential-integrity, and snapshot-row-count verification
        # verify-production.js (not verify.js): production-data-agnostic checks -- structure, FK
        # integrity, invariants, and a snapshot-time row-count comparison against the manifest --
        # never a specific row's value, so nothing financial or personal ever appears in this step's
        # output (every check here returns a count or a short fixed status string; confirmed by
        # reading CHECKS in src/verify-production.js, not assumed).
        if: ${{ steps.select.outputs.backup_id != '' }}
        working-directory: scripts/financial-backup
        env:
          PG_TOOLS_VIA_DOCKER: "1"
          FINANCIAL_BACKUP_TARGET_URL: postgresql://postgres:postgres@localhost:5432/postgres
          FINANCIAL_BACKUP_BACKUP_ID: ${{ steps.select.outputs.backup_id }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
          R2_ARCHIVE_READER_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_READER_ACCESS_KEY_ID }}
          R2_ARCHIVE_READER_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_READER_SECRET_ACCESS_KEY }}
        run: npm run verify-production
      # No upload-artifact step, ever: the restored schema/data exist only inside the `target`
      # service container, which GitHub Actions destroys unconditionally when this job ends --
      # nothing restored here outlives the run, and nothing unencrypted is written to any artifact.

  # Persists the restore-test verdict as one immutable R2 record, and ONLY that -- no restore, no
  # download of real backup content, no access to FINANCIAL_BACKUP_TARGET_URL or the ephemeral
  # target. Deliberately a SEPARATE job so the R2 WRITER credential this needs is never granted to
  # the `restore-test` job itself (which downloads and restores real backup content into an
  # ephemeral container) -- "narrowly scoped, append-only verification-result storage" without
  # expanding what that job can do. Runs after restore-test unconditionally (`always()`), but only
  # does anything if restore-test actually ran and reached a real pass/fail (never for a skipped
  # run, e.g. backup/connection-check mode, or a guard-skipped scheduled week).
  record-restore-test-result:
    runs-on: ubuntu-latest
    needs: restore-test
    if: always() && (needs.restore-test.result == 'success' || needs.restore-test.result == 'failure')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backup tool dependencies
        working-directory: scripts/financial-backup
        run: npm install

      - name: Record restore-test result
        # If restore-test's own "Select backup to test" step somehow produced no backup_id (it
        # shouldn't reach here in that case, since every real check step is itself gated on that
        # output being non-empty -- but guarded again here rather than writing a record for an
        # empty/unknown backup_id).
        if: ${{ needs.restore-test.outputs.backup_id != '' }}
        working-directory: scripts/financial-backup
        env:
          RESTORE_TEST_BACKUP_ID: ${{ needs.restore-test.outputs.backup_id }}
          RESTORE_TEST_RESULT: ${{ needs.restore-test.result == 'success' && 'passed' || 'failed' }}
          RESTORE_TEST_TRIGGER: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
          R2_ARCHIVE_WRITER_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_WRITER_ACCESS_KEY_ID }}
          R2_ARCHIVE_WRITER_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_WRITER_SECRET_ACCESS_KEY }}
          R2_ARCHIVE_READER_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_READER_ACCESS_KEY_ID }}
          R2_ARCHIVE_READER_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_READER_SECRET_ACCESS_KEY }}
        run: npm run write-restore-test-result

  # Read-only on-demand status check -- no dump, no restore, no R2 write, only the READER R2
  # credential. Exists so "what does health.js currently report" can be answered independently of
  # ever running a real backup (the existing Health check step above only runs right after a real
  # upload) or waiting for the next scheduled run. Runs only on an explicit `mode: health` dispatch.
  health-check:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'health'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backup tool dependencies
        working-directory: scripts/financial-backup
        run: npm install

      - name: Health check (read-only, reader credential only)
        working-directory: scripts/financial-backup
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
          R2_ARCHIVE_READER_ACCESS_KEY_ID: ${{ secrets.R2_ARCHIVE_READER_ACCESS_KEY_ID }}
          R2_ARCHIVE_READER_SECRET_ACCESS_KEY: ${{ secrets.R2_ARCHIVE_READER_SECRET_ACCESS_KEY }}
        run: npm run health
