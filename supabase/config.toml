
# Local-only port overrides for this worktree (receipt-archive-automation) so
# `supabase start` doesn't collide with another project's local stack already
# running on the default ports. Not meaningful for deployment.
project_id = "receipt-archive-automation"

[api]
port = 55421

[db]
port = 55422
shadow_port = 55420

[studio]
port = 55423

[inbucket]
port = 55424

[analytics]
port = 55427

[functions.open-weekly-registrations]
enabled = true
verify_jwt = false
entrypoint = "./functions/open-weekly-registrations/index.ts"

[functions.generate-subscription-charges]
enabled = true
verify_jwt = false
entrypoint = "./functions/generate-subscription-charges/index.ts"

[functions.notify-waitlist]
enabled = true
verify_jwt = false
entrypoint = "./functions/notify-waitlist/index.ts"

[functions.staff-user-email]
enabled = true
verify_jwt = true
entrypoint = "./functions/staff-user-email/index.ts"

[functions.generate-document-pdf]
enabled = true
verify_jwt = true
entrypoint = "./functions/generate-document-pdf/index.ts"

[functions.send-document-email]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-document-email/index.ts"

[functions.generate-monthly-summary-pdf]
enabled = true
verify_jwt = true
entrypoint = "./functions/generate-monthly-summary-pdf/index.ts"

[functions.send-monthly-summary-email]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-monthly-summary-email/index.ts"

[functions.dispatch-notifications]
enabled = true
verify_jwt = false
entrypoint = "./functions/dispatch-notifications/index.ts"

[functions.staff-confirm-email]
enabled = true
verify_jwt = true
entrypoint = "./functions/staff-confirm-email/index.ts"

[functions.archive-document-pdf]
enabled = true
verify_jwt = false
entrypoint = "./functions/archive-document-pdf/index.ts"
