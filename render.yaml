# Render Blueprint: static Expo web app from mobile/
# https://render.com/docs/blueprint-spec
#
# After linking the repo, set EXPO_PUBLIC_* when prompted (sync: false),
# or add them under the service → Environment.

services:
  - type: web
    name: shira-fit-mobile-web
    runtime: static
    rootDir: mobile
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - mobile/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Performance Phase 2: the JS bundle, fonts and images under these paths have content-hashed file names (a new build
    # gets new names), so browsers may keep them for a year without asking. They were served with max-age=0, so every
    # cold start revalidated the ~1 MB bundle (one extra round trip before the app could run). index.html, sw.js and the
    # manifest keep the default revalidation, so a new deployment is still picked up on the next launch.
    headers:
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: EXPO_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
