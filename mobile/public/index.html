<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!--
      First-paint lang/dir only, so a Hebrew session never flashes LTR before React mounts.
      I18nContext (src/lib/languagePreference.ts) stays the authoritative language state and re-applies both
      attributes; this mirrors its device-level fallback (saved choice → browser language → English).
      languagePreference.test.ts runs this exact script against resolveLanguage to keep them in sync.
    -->
    <script id="initial-language">
      (function () {
        try {
          var lang = null;
          try {
            var saved = localStorage.getItem("shira_fit_language");
            if (saved === "he" || saved === "en") lang = saved;
          } catch (e) {}
          if (!lang) {
            var tags = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
            for (var i = 0; i < tags.length && !lang; i++) {
              var primary = String(tags[i] || "").toLowerCase().split(/[-_]/)[0];
              if (primary === "he" || primary === "iw") lang = "he";
              else if (primary === "en") lang = "en";
            }
          }
          lang = lang === "he" ? "he" : "en";
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />

    <!-- iOS Safari "Add to Home Screen" reads these instead of the web manifest. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shira Fit" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
